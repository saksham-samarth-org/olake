# TEST ONLY: PR 1379 workflows, job bodies stubbed (real gate + real Detect changes).
---
name: Go Security CI
'on':
  push:
    branches:
    - master
    paths: &1
    - "**/*.go"
    - "**/*.java"
    - "**/go.mod"
    - "**/*.yml"
    - "**/*.yaml"
    - "**/pom.xml"
    - "**/.trivyignore"
  pull_request:
    branches:
    - "*"
    paths: *1
  merge_group:
    types:
    - checks_requested
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        required: true
        default: warning
jobs:
  gate:
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: "./.github/workflows/queue-gate.yml"
  govulncheck:
    name: govulncheck
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
    timeout-minutes: 5
  gosec:
    name: GoSec Security Scanner
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
    timeout-minutes: 5
  trivy-go:
    name: trivy-go
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  trivy-java:
    name: trivy-java
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
