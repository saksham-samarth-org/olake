name: Go Build and Lint
on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "*"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - run: sleep 1800
      - run: echo "golangci stubbed for merge queue testing"

  build-check:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "build-check stubbed for merge queue testing"
