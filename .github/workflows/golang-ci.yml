# TEST ONLY: PR 1379 workflows, job bodies stubbed (real gate + real Detect changes).
---
name: Go Build and Lint
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - "*"
  merge_group:
    types:
    - checks_requested
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        required: true
        default: warning
jobs:
  gate:
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: "./.github/workflows/queue-gate.yml"
  golangci:
    name: golangci-lint
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
    timeout-minutes: 5
  build-check:
    name: Build
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
    timeout-minutes: 5
