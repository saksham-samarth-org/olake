name: Unit Tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "unit-tests stubbed for merge queue testing"

  java-unit-tests:
    name: Run Java Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Java Unit Tests
        working-directory: destination/iceberg/olake-iceberg-java-writer
        run: mvn -B --no-transfer-progress test
