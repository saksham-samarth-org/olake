# TEST ONLY: stubbed jobs, triggers and gates are real.
---
name: Test Preflight
'on':
  workflow_call:
    inputs:
      go-checks:
        description: Run lint + gosec with the Go cache job. The suite that owns the
          checks sets it; the others just consume the cache.
        required: false
        default: false
        type: boolean
    outputs:
      drivers:
        description: JSON array of drivers the caller should fan its matrix out over;
          [] means nothing to test.
        value: "${{ jobs.preflight.outputs.drivers }}"
      sources:
        description: 'JSON array of source stacks: one entry per driver, plus one
          per alternate server compose file.'
        value: "${{ jobs.preflight.outputs.sources }}"
      drivers-with-compatibility-tests:
        description: JSON array of drivers whose tests define a compatibility test
          and, on a PR, that exist at the base commit.
        value: "${{ jobs.preflight.outputs.drivers-with-compatibility-tests }}"
      base-image-misses:
        description: JSON array of drivers whose base branch image is not in the registry
          yet; [] or empty means nothing to build.
        value: "${{ jobs.preflight.outputs.base-image-misses }}"
      redundant:
        description: true when a merge queue entry has the same tree as a PR head
          whose required checks passed, so every job can skip.
        value: "${{ jobs.gate.outputs.skip }}"
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    if: github.event_name == 'merge_group'
    uses: "./.github/workflows/queue-gate.yml"
  preflight:
    name: Detect changes
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      drivers: '["postgres"]'
      sources: '[{"name":"postgres","driver":"postgres","make_vars":""}]'
      drivers-with-compatibility-tests: '["postgres"]'
      jar-cached: 'false'
      go-cached: 'false'
      go-checks-changed: 'false'
      base-image-misses: "[]"
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  build-jar:
    name: Build Iceberg writer jar
    needs: preflight
    if: "${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.drivers
      != '[]' && needs.preflight.outputs.jar-cached != 'true' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  apt-warm:
    name: Warm base docker layers
    needs: preflight
    if: "${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.drivers
      != '[]' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  go-cache:
    name: Go checks + cache
    needs: preflight
    if: "${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.drivers
      != '[]' && (needs.preflight.outputs.go-cached != 'true' || needs.preflight.outputs.go-checks-changed
      == 'true') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
