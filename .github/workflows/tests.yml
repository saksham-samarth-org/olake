# TEST ONLY: PR 1379 workflows, job bodies stubbed (real gate + real Detect changes).
---
name: Tests
'on':
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Compat baseline: a release tag (v0.6.5), a full image ref, or
          a commit sha. Empty = all the older releases with a state version update.'
        required: false
        default: ''
        type: string
  push:
    branches:
    - master
    - staging
    paths: &1
    - "**/*.go"
    - "**/go.mod"
    - "**/go.work"
    - "**/*.java"
    - "**/pom.xml"
    - Dockerfile
    - ".dockerignore"
    - Makefile
    - drivers/*/driver.mk
    - drivers/**.conf
    - constants/state-versions.json
    - tests/**
    - drivers/*/docker-compose.yml
    - destination/iceberg/local-test/**
    - ".golangci.yml"
    - ".github/actions/**"
    - ".github/scripts/**"
    - ".github/workflows/tests.yml"
    - ".github/workflows/test-preflight.yml"
  pull_request:
    branches:
    - "*"
    paths: *1
  merge_group:
    types:
    - checks_requested
jobs:
  preflight:
    name: Pre-Validation
    uses: "./.github/workflows/test-preflight.yml"
    permissions:
      contents: read
      pull-requests: read
      packages: read
      statuses: read
    with:
      go-checks: true
    secrets: inherit
  approve:
    name: Approve Test Deployment
    needs: preflight
    if: needs.preflight.outputs.drivers != '[]' && needs.preflight.outputs.redundant
      != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      attempt: "${{ github.run_attempt }}"
      drivers: "${{ needs.preflight.outputs.drivers }}"
      sources: "${{ needs.preflight.outputs.sources }}"
      drivers-with-compatibility-tests: "${{ needs.preflight.outputs.drivers-with-compatibility-tests
        }}"
      base-image-misses: "${{ needs.preflight.outputs.base-image-misses }}"
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  integration-tests:
    name: Integration Test ${{ matrix.name }}
    needs: approve
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: "${{ fromJSON(needs.approve.outputs.sources) }}"
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  base-images:
    name: Build base branch driver images
    needs: approve
    if: "(github.event_name == 'pull_request' || github.event_name == 'merge_group')
      && needs.approve.outputs.base-image-misses != '' && needs.approve.outputs.base-image-misses
      != '[]'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 5
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  test-backward-compatibility:
    name: Backward Compatibility with ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref
      }}
    needs:
    - approve
    - integration-tests
    - base-images
    if: "${{ !cancelled() && needs.approve.outputs.drivers-with-compatibility-tests
      != '[]' && needs.integration-tests.result == 'success' && (needs.base-images.result
      == 'success' || needs.base-images.result == 'skipped') }}"
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      matrix:
        baseline: ${{ fromJSON(github.event_name == 'pull_request' && format('["{0}"]',
          github.event.pull_request.base.sha) || github.event_name == 'merge_group'
          && format('["{0}"]', github.event.merge_group.base_sha) || '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  backward-compatibility-with-old-releases:
    name: Backward Compatibility with Older Releases
    needs: approve
    if: "(github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request'
      && github.base_ref == 'master')) && needs.approve.outputs.drivers-with-compatibility-tests
      != '[]'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        driver: "${{ fromJSON(needs.approve.outputs.drivers-with-compatibility-tests)
          }}"
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
  performance-tests:
    name: Performance Test
    needs: approve
    if: github.head_ref == 'staging' && github.base_ref == 'master'
    permissions:
      actions: read
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('[{"driver":"mysql","driver_upper":"MYSQL","instance_id":8},{"driver":"postgres","driver_upper":"POSTGRES","instance_id":9}]')
          }}
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
