# TEST ONLY: PR 1379 workflows, job bodies stubbed (real gate + real Detect changes).
---
name: Unit Tests
'on':
  pull_request: 
  merge_group:
    types:
    - checks_requested
  push:
    branches:
    - master
permissions:
  contents: read
jobs:
  gate:
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: "./.github/workflows/queue-gate.yml"
  unit-tests:
    name: Run Unit Tests
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
    timeout-minutes: 5
  java-unit-tests:
    name: Run Java Unit Tests
    needs: gate
    if: "${{ !cancelled() && needs.gate.outputs.skip != 'true' }}"
    runs-on: ubuntu-latest
    steps:
    - name: Stub
      run: 'echo "STUB PASSED: ${{ github.workflow }} / ${{ github.job }} (${{ github.event_name
        }})"'
    timeout-minutes: 5
